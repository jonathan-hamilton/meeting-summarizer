name: Deploy Development Application

on:
  push:
    branches: [main]
    paths:
      - 'MeetingSummarizer.Api/**'
      - 'frontend/**'
      - '.github/workflows/dev-application.yml'
  pull_request:  # ENABLED: Container working, ready for Azure deployment
    branches: [main]
    paths:
      - 'MeetingSummarizer.Api/**'
      - 'frontend/**'
      - '.github/workflows/dev-application.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force application deployment'
        required: false
        default: false
        type: boolean
      confirm_destructive:
        description: 'Confirm destructive database operations (DELETE, DROP, TRUNCATE)'
        required: false
        default: false
        type: boolean
      backup_before_destructive:
        description: 'Create database backup before destructive operations'
        required: false
        default: true
        type: boolean
  workflow_run:
    workflows: ["Deploy Development Infrastructure"]
    types:
      - completed

# Updated: Container now builds with React frontend + .NET API integration
concurrency:
  group: dev-application
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}

jobs:
  check-infrastructure:
    name: Check Infrastructure Status
    runs-on: ubuntu-latest
    outputs:
      infrastructure-completed: ${{ steps.check.outputs.infrastructure-completed }}
      should-proceed: ${{ steps.check.outputs.should-proceed }}
    
    steps:
    - name: Check Infrastructure Workflow Status
      id: check
      run: |
        # Check if this was triggered by infrastructure completion
        if [ "${{ github.event_name }}" = "workflow_run" ]; then
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "infrastructure-completed=true" >> $GITHUB_OUTPUT
            echo "should-proceed=true" >> $GITHUB_OUTPUT
            echo "✅ Infrastructure workflow completed successfully, proceeding with application deployment"
          else
            echo "infrastructure-completed=false" >> $GITHUB_OUTPUT  
            echo "should-proceed=false" >> $GITHUB_OUTPUT
            echo "❌ Infrastructure workflow failed, skipping application deployment"
            exit 1
          fi
        else
          # Triggered by push/PR - check if infrastructure is currently running
          echo "infrastructure-completed=unknown" >> $GITHUB_OUTPUT
          echo "should-proceed=true" >> $GITHUB_OUTPUT
          echo "🚀 Triggered by code changes, proceeding with application deployment"
        fi

  get-infrastructure-info:
    name: Get Infrastructure Information
    runs-on: ubuntu-latest
    needs: check-infrastructure
    if: needs.check-infrastructure.outputs.should-proceed == 'true'
    environment: development
    
    permissions:
      id-token: write
      contents: read
      
    outputs:
      resource-group-name: ${{ steps.terraform.outputs.resource-group-name }}
      container-registry-name: ${{ steps.terraform.outputs.container-registry-name }}
      container-app-name: ${{ steps.terraform.outputs.container-app-name }}
      container-app-fqdn: ${{ steps.terraform.outputs.container-app-fqdn }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure CLI login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.6
        terraform_wrapper: false
        
    - name: Get Infrastructure Outputs
      id: terraform
      run: |
        cd azure-infrastructure/terraform
        terraform init -backend-config="key=dev/terraform.tfstate"
        
        # Get outputs from existing infrastructure
        echo "resource-group-name=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
        echo "container-registry-name=$(terraform output -raw container_registry_name)" >> $GITHUB_OUTPUT
        echo "container-app-name=$(terraform output -raw container_app_name)" >> $GITHUB_OUTPUT
        echo "container-app-fqdn=$(terraform output -raw container_app_fqdn)" >> $GITHUB_OUTPUT

  apply-migrations:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    needs: [check-infrastructure, get-infrastructure-info]
    environment: development
    
    outputs:
      destructive-operations-found: ${{ steps.safety-check.outputs.destructive-found }}
      backup-created: ${{ steps.backup.outputs.backup-created }}
      backup-name: ${{ steps.backup.outputs.backup-name }}
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Install EF Core Tools
      run: dotnet tool install --global dotnet-ef
    
    - name: Restore Dependencies
      run: |
        cd MeetingSummarizer.Api
        dotnet restore
    
    - name: Check for Pending Migrations
      id: pending-check
      run: |
        echo "🔍 Checking for pending database migrations..."
        cd MeetingSummarizer.Api
        
        # Fix the Azure AD connection string for migration checking
        FIXED_CONNECTION_STRING="${{ secrets.DEV_DATABASE_CONNECTION_STRING }}"
        FIXED_CONNECTION_STRING=$(echo "$FIXED_CONNECTION_STRING" | sed 's/Authentication=Active Directory Service Principal/Authentication=Active Directory Default/g')
        FIXED_CONNECTION_STRING=$(echo "$FIXED_CONNECTION_STRING" | sed 's/;User Id=[^;]*//g')
        FIXED_CONNECTION_STRING=$(echo "$FIXED_CONNECTION_STRING" | sed 's/;User ID=[^;]*//g')
        FIXED_CONNECTION_STRING=$(echo "$FIXED_CONNECTION_STRING" | sed 's/;Password=[^;]*//g')
        FIXED_CONNECTION_STRING=$(echo "$FIXED_CONNECTION_STRING" | sed 's/;PWD=[^;]*//g')
        FIXED_CONNECTION_STRING=$(echo "$FIXED_CONNECTION_STRING" | sed 's/;TenantId=[^;]*//g' | sed 's/;Tenant ID=[^;]*//g')
        
        export ConnectionStrings__DefaultConnection="$FIXED_CONNECTION_STRING"
        
        # Check for pending migrations
        PENDING_MIGRATIONS=$(dotnet ef migrations list --pending --no-build 2>/dev/null || echo "")
        
        if [ -z "$PENDING_MIGRATIONS" ] || [ "$PENDING_MIGRATIONS" = "No migrations were found." ]; then
          echo "✅ No pending migrations found - database is up to date"
          echo "has-pending=false" >> $GITHUB_OUTPUT
          echo "pending-count=0" >> $GITHUB_OUTPUT
        else
          MIGRATION_COUNT=$(echo "$PENDING_MIGRATIONS" | wc -l)
          echo "🔄 Found $MIGRATION_COUNT pending migration(s):"
          echo "$PENDING_MIGRATIONS"
          echo "has-pending=true" >> $GITHUB_OUTPUT
          echo "pending-count=$MIGRATION_COUNT" >> $GITHUB_OUTPUT
        fi
      env:
        ASPNETCORE_ENVIRONMENT: Development
    
    - name: Check Migration Safety & Backup Planning
      id: safety-check
      if: steps.pending-check.outputs.has-pending == 'true'
      run: |
        echo "🔍 Checking pending migrations for destructive operations..."
        cd MeetingSummarizer.Api
        
        # Check for dangerous SQL operations only in pending migration files
        DESTRUCTIVE_FOUND=false
        DESTRUCTIVE_FILES=""
        
        cd Migrations
        
        # Get pending migrations directly instead of using multiline output
        cd ../
        PENDING_MIGRATIONS=$(dotnet ef migrations list --pending --no-build 2>/dev/null || echo "")
        cd Migrations
        
        # Check each pending migration file
        echo "$PENDING_MIGRATIONS" | while read -r migration_name; do
          if [ -n "$migration_name" ] && [ "$migration_name" != "No migrations were found." ]; then
            # Find migration file by name pattern
            MIGRATION_FILE=$(ls -1 *"$migration_name"*.cs 2>/dev/null | head -1)
            
            if [ -n "$MIGRATION_FILE" ] && [ -f "$MIGRATION_FILE" ]; then
              echo "🔍 Checking migration file: $MIGRATION_FILE"
              
              if grep -l "DELETE FROM\|TRUNCATE TABLE\|DROP TABLE\|DROP COLUMN\|DROP INDEX\|migrationBuilder\.Sql.*DELETE\|migrationBuilder\.Sql.*TRUNCATE\|migrationBuilder\.Sql.*DROP" "$MIGRATION_FILE" > /dev/null 2>&1; then
                DESTRUCTIVE_FOUND=true
                DESTRUCTIVE_FILES="$DESTRUCTIVE_FILES $MIGRATION_FILE"
                echo "⚠️  Destructive operations found in: $MIGRATION_FILE"
                
                # Show the specific destructive lines
                echo "   Destructive operations:"
                grep -n "DELETE FROM\|TRUNCATE TABLE\|DROP TABLE\|DROP COLUMN\|DROP INDEX\|migrationBuilder\.Sql.*DELETE\|migrationBuilder\.Sql.*TRUNCATE\|migrationBuilder\.Sql.*DROP" "$MIGRATION_FILE" | head -5
              else
                echo "✅ No destructive operations in: $MIGRATION_FILE"
              fi
            else
              echo "⚠️  Could not find migration file for: $migration_name"
            fi
          fi
        done
        
        if [ "$DESTRUCTIVE_FOUND" = true ]; then
          echo ""
          echo "🚨 DESTRUCTIVE OPERATIONS DETECTED IN PENDING MIGRATIONS!"
          echo "Files with potential data loss operations:$DESTRUCTIVE_FILES"
          echo ""
          echo "📋 REQUIRED ACTIONS BEFORE PROCEEDING:"
          echo "1. ✅ Review destructive operations above"
          echo "2. ✅ Confirm data backup is available or not needed"
          echo "3. ✅ Add conditional logic to preserve important data"
          echo "4. ✅ Set confirm_destructive=true if intentional"
          echo ""
          echo "📖 See docs/DATABASE_MIGRATION_SAFETY.md for guidelines"
          echo ""
          
          # Check if confirmation was provided
          if [ "${{ github.event.inputs.confirm_destructive }}" != "true" ]; then
            echo "❌ DEPLOYMENT BLOCKED: Destructive operations require explicit confirmation"
            echo ""
            echo "To proceed:"
            echo "• Run workflow_dispatch with 'confirm_destructive: true'"
            echo "• Modify migrations to be non-destructive"
            exit 1
          else
            echo "⚠️  DESTRUCTIVE OPERATIONS CONFIRMED - Proceeding with caution..."
          fi
        else
          echo "✅ Migration safety check passed - No destructive operations in pending migrations"
        fi
        
        # Set outputs
        echo "destructive-found=$DESTRUCTIVE_FOUND" >> $GITHUB_OUTPUT
      env:
        ASPNETCORE_ENVIRONMENT: Development
    
    - name: Create Database Backup (Conditional)
      id: backup
      if: steps.safety-check.outputs.destructive-found == 'true' && (github.event.inputs.backup_before_destructive != 'false')
      run: |
        echo "💾 Creating database backup before destructive operations..."
        
        # Generate backup name with timestamp
        BACKUP_NAME="meetingsummary-dev-backup-$(date +%Y%m%d-%H%M%S)"
        STORAGE_ACCOUNT="msdev10122104"  # From your Azure config
        CONTAINER_NAME="database-backups"
        
        echo "📦 Backup name: $BACKUP_NAME"
        
        # Create storage container if it doesn't exist
        az storage container create \
          --name $CONTAINER_NAME \
          --account-name $STORAGE_ACCOUNT \
          --public-access off \
          --only-show-errors || true
        
        # Export database to bacpac
        echo "🔄 Starting database export..."
        az sql db export \
          --server meetingsummary-dev-v2-sql \
          --name meetingsummary-dev-v2-db \
          --resource-group rg-meetingsummary-dev \
          --storage-key-type StorageAccessKey \
          --storage-key $(az storage account keys list --account-name $STORAGE_ACCOUNT --query "[0].value" -o tsv) \
          --storage-uri "https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER_NAME/$BACKUP_NAME.bacpac" \
          --admin-user meetingadmin \
          --admin-password "Kx9mQ7vR3zL8nP2wT6yU4bN1cX5jM9pS2"
        
        echo "✅ Database backup created: $BACKUP_NAME.bacpac"
        echo "📍 Location: https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER_NAME/$BACKUP_NAME.bacpac"
        echo ""
        echo "🔄 To restore from this backup if needed:"
        echo "az sql db import \\"
        echo "  --server meetingsummary-dev-v2-sql \\"
        echo "  --name meetingsummary-dev-v2-db-restored \\"
        echo "  --resource-group rg-meetingsummary-dev \\"
        echo "  --storage-key-type StorageAccessKey \\"
        echo "  --storage-key \$(az storage account keys list --account-name $STORAGE_ACCOUNT --query \"[0].value\" -o tsv) \\"
        echo "  --storage-uri \"https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER_NAME/$BACKUP_NAME.bacpac\" \\"
        echo "  --admin-user meetingadmin \\"
        echo "  --admin-password \"Kx9mQ7vR3zL8nP2wT6yU4bN1cX5jM9pS2\""
        
        # Set outputs
        echo "backup-created=true" >> $GITHUB_OUTPUT
        echo "backup-name=$BACKUP_NAME" >> $GITHUB_OUTPUT
        echo "backup-uri=https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER_NAME/$BACKUP_NAME.bacpac" >> $GITHUB_OUTPUT
    
    - name: Azure CLI login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Apply Database Migrations
      if: steps.pending-check.outputs.has-pending == 'true'
      run: |
        echo "🗄️ Applying ${{ steps.pending-check.outputs.pending-count }} pending database migration(s)..."
        echo "Migrations to apply:"
        echo "${{ steps.pending-check.outputs.pending-list }}"
        echo ""
        
        cd MeetingSummarizer.Api
        
        # Fix the Azure AD connection string by ensuring proper format for CLI auth
        FIXED_CONNECTION_STRING="${{ secrets.DEV_DATABASE_CONNECTION_STRING }}"
        
        # For Azure CLI authentication, we need Authentication=Active Directory Default
        # which will use the current Azure CLI context (OIDC login)
        echo "🔍 Original connection string format:"
        echo "$FIXED_CONNECTION_STRING" | sed 's/Password=[^;]*/Password=****/g' | sed 's/User ID=[^;]*/User ID=****/g'
        
        # Replace Service Principal auth with Default (CLI) auth and remove User ID and Password
        FIXED_CONNECTION_STRING=$(echo "$FIXED_CONNECTION_STRING" | sed 's/Authentication=Active Directory Service Principal/Authentication=Active Directory Default/g')
        FIXED_CONNECTION_STRING=$(echo "$FIXED_CONNECTION_STRING" | sed 's/;User Id=[^;]*//g')
        FIXED_CONNECTION_STRING=$(echo "$FIXED_CONNECTION_STRING" | sed 's/;User ID=[^;]*//g')
        FIXED_CONNECTION_STRING=$(echo "$FIXED_CONNECTION_STRING" | sed 's/;Password=[^;]*//g')
        FIXED_CONNECTION_STRING=$(echo "$FIXED_CONNECTION_STRING" | sed 's/;PWD=[^;]*//g')
        FIXED_CONNECTION_STRING=$(echo "$FIXED_CONNECTION_STRING" | sed 's/;TenantId=[^;]*//g' | sed 's/;Tenant ID=[^;]*//g')
        
        # Debug: Show final connection string format (without sensitive data)
        echo "🔍 Final connection string format:"
        echo "$FIXED_CONNECTION_STRING" | sed 's/Password=[^;]*/Password=****/g' | sed 's/User ID=[^;]*/User ID=****/g'
        
        export ConnectionStrings__DefaultConnection="$FIXED_CONNECTION_STRING"
        
        # Apply migrations to development database
        dotnet ef database update --verbose
      env:
        ASPNETCORE_ENVIRONMENT: Development

  deploy-application:
    name: Deploy Application Container
    runs-on: ubuntu-latest
    needs: [check-infrastructure, get-infrastructure-info, apply-migrations]
    environment: development
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure CLI login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Build and Deploy Container Application
      run: |
        # Get infrastructure details
        REGISTRY_NAME="${{ needs.get-infrastructure-info.outputs.container-registry-name }}"
        REGISTRY_SERVER="${REGISTRY_NAME}.azurecr.io"
        CONTAINER_APP_NAME="${{ needs.get-infrastructure-info.outputs.container-app-name }}"
        RESOURCE_GROUP="${{ needs.get-infrastructure-info.outputs.resource-group-name }}"
        
        echo "🚀 Deploying application to Container App: $CONTAINER_APP_NAME"
        echo "📦 Using Container Registry: $REGISTRY_SERVER"
        
        # Build and push container image
        echo "🏗️ Building container image..."
        TIMESTAMP_TAG=$(date +%Y%m%d-%H%M%S)
        echo "📅 Using timestamp tag: $TIMESTAMP_TAG"
        
        az acr build \
          --registry $REGISTRY_NAME \
          --image meeting-summary-api:latest \
          --image meeting-summary-api:$TIMESTAMP_TAG \
          --file MeetingSummarizer.Api/Dockerfile \
          .
        
        # Wait for any ongoing container app operations to complete
        echo "⏳ Ensuring container app is ready for update..."
        sleep 15
        
        # Update container app with timestamped image to force refresh
        echo "🔄 Updating container app with new image..."
        echo "🎯 Using timestamped image: ${REGISTRY_SERVER}/meeting-summary-api:$TIMESTAMP_TAG"
        
        # Generate revision name based on timestamp
        REVISION_NAME="dev-api-v2--$(date +%Y%m%d%H%M%S)"
        
        az containerapp update \
          --name "$CONTAINER_APP_NAME" \
          --resource-group "$RESOURCE_GROUP" \
          --image "${REGISTRY_SERVER}/meeting-summary-api:$TIMESTAMP_TAG" \
          --set-env-vars ASPNETCORE_ENVIRONMENT=Development \
          --set-env-vars KeyVault__ClientId=5ed62488-7c1f-42bf-b855-d501d84f1f7c \
          --set-env-vars KeyVault__ClientSecret=${{ secrets.SERVICE_PRINCIPAL_CLIENT_SECRET }} \
          --set-env-vars KeyVault__TenantId=1c30d7a8-9627-4b0c-b799-12bae25a849b \
          --set-env-vars CONTAINER_APP_REVISION="$REVISION_NAME" || {
            echo "❌ Standard update failed, trying alternative approach..."
            
            # Alternative: Create new revision with timestamped image
            az containerapp revision set-mode \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --mode Multiple
              
            az containerapp revision copy \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --from-revision "" \
              --image "${REGISTRY_SERVER}/meeting-summary-api:$TIMESTAMP_TAG"
        }
        
        # Get the updated app URL
        APP_URL=$(az containerapp show \
          --name "$CONTAINER_APP_NAME" \
          --resource-group "$RESOURCE_GROUP" \
          --query "properties.configuration.ingress.fqdn" -o tsv)
        
        echo "✅ Application deployed successfully!"
        echo "🌐 Application URL: https://$APP_URL"

  deployment-summary:
    name: Application Deployment Summary
    runs-on: ubuntu-latest
    needs: [check-infrastructure, get-infrastructure-info, deploy-application]
    if: always()
    
    steps:
    - name: Create Summary
      run: |
        echo "## 🚀 Application Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment**: Development" >> $GITHUB_STEP_SUMMARY
        echo "**Container App**: ${{ needs.get-infrastructure-info.outputs.container-app-name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Application URL**: https://${{ needs.get-infrastructure-info.outputs.container-app-fqdn }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.deploy-application.result }}" = "success" ]; then
          echo "✅ **Status**: Application Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Ready**: Your application is now live and accessible!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Status**: Application Deployment Failed" >> $GITHUB_STEP_SUMMARY
        fi