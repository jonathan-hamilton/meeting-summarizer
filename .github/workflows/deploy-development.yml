name: Deploy to Development Environment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes detected'
        required: false
        default: false
        type: boolean

concurrency:
  group: development-deployment
  cancel-in-progress: false  # Changed to false to prevent resource conflicts

defaults:
  run:
    shell: bash

env:
  ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_environment: "dev"
  TF_VAR_location: "westus"

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: development
    
    permissions:
      id-token: write
      contents: read
      
    outputs:
      resource-group-name: ${{ steps.terraform.outputs.resource-group-name }}
      container-app-fqdn: ${{ steps.terraform.outputs.container-app-fqdn }}
      container-registry-name: ${{ steps.terraform.outputs.container-registry-name }}
      container-app-name: ${{ steps.terraform.outputs.container-app-name }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure CLI login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.6
        terraform_wrapper: false
        
    - name: Terraform Init
      run: |
        cd azure-infrastructure/terraform
        terraform init -backend-config="key=dev/terraform.tfstate"
    
    - name: Terraform Plan
      run: |
        cd azure-infrastructure/terraform
        terraform plan \
          -var="environment=dev" \
          -var="location=westus" \
          -var="sql_admin_login=${{ secrets.SQL_ADMIN_LOGIN }}" \
          -var="sql_admin_password=${{ secrets.SQL_ADMIN_PASSWORD }}" \
          -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
          -var="sendgrid_api_key=${{ secrets.SENDGRID_API_KEY }}" \
          -out=tfplan
    
    - name: Terraform Apply
      id: terraform
      run: |
        cd azure-infrastructure/terraform
        terraform apply -auto-approve tfplan
        
        # Set outputs for next jobs
        echo "resource-group-name=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
        echo "container-app-fqdn=$(terraform output -raw container_app_fqdn)" >> $GITHUB_OUTPUT  
        echo "container-registry-name=$(terraform output -raw container_registry_name)" >> $GITHUB_OUTPUT

  deploy-backend:
    name: Deploy Backend Container
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    environment: development
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure CLI login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Build and Deploy Container
      run: |
        # Get ACR login server and container app name from Terraform outputs
        REGISTRY_NAME="${{ needs.deploy-infrastructure.outputs.container-registry-name }}"
        REGISTRY_SERVER="${REGISTRY_NAME}.azurecr.io"
        CONTAINER_APP_NAME="${{ needs.deploy-infrastructure.outputs.container-app-name }}"
        
        echo "🚀 Deploying to Container App: $CONTAINER_APP_NAME"
        echo "📦 Using Container Registry: $REGISTRY_SERVER"
        
        # Build and push container image from repository root
        az acr build --registry $REGISTRY_NAME --image meeting-summary-api:latest --file MeetingSummarizer.Api/Dockerfile .
        
        # Update container app with dynamic name
        az containerapp update \
          --name "$CONTAINER_APP_NAME" \
          --resource-group "${{ needs.deploy-infrastructure.outputs.resource-group-name }}" \
          --image "${REGISTRY_SERVER}/meeting-summary-api:latest"

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-backend]
    if: always()
    
    steps:
    - name: Create Summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment**: Development" >> $GITHUB_STEP_SUMMARY
        echo "**Resource Group**: ${{ needs.deploy-infrastructure.outputs.resource-group-name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Container App URL**: https://${{ needs.deploy-infrastructure.outputs.container-app-fqdn }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.deploy-infrastructure.result }}" = "success" ] && [ "${{ needs.deploy-backend.result }}" = "success" ]; then
          echo "✅ **Status**: Deployment Successful" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Status**: Deployment Failed" >> $GITHUB_STEP_SUMMARY
        fi