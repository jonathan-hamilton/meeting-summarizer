name: Deploy to Development

on:
  # Re-enabled automatic deployment on push - domain and SSL are now working
  push:
    branches: 
      - main  # Deploy main branch to development
  workflow_dispatch:
    inputs:
      force-deploy:
        description: 'Force deployment even if tests fail'
        required: false
        type: boolean
        default: false

# Prevent multiple development deployments from running simultaneously
concurrency:
  group: dev-deployment-${{ github.ref }}
  cancel-in-progress: true

# Set default shell for all run commands
defaults:
  run:
    shell: bash

env:
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ENVIRONMENT: development

jobs:
  # ====================
  # BUILD AND TEST
  # ====================
  build-and-test:
    name: Build & Test
    uses: ./.github/workflows/shared-build.yml
    with:
      environment: development
      run-security-scan: false  # Skip security scan for dev deployments
    secrets: inherit

  # ====================
  # DEPLOY INFRASTRUCTURE
  # ====================
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: development
    
    # Set up permissions for OIDC authentication
    permissions:
      id-token: write
      contents: read
      
    outputs:
      app-service-name: ${{ steps.terraform.outputs.app-service-name }}
      static-web-app-name: ${{ steps.terraform.outputs.static-web-app-name }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Azure CLI login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.6
        terraform_wrapper: false
        
    - name: Terraform Init
      run: |
        cd azure-infrastructure/terraform
        terraform init \
          -backend-config="storage_account_name=${{ vars.TERRAFORM_STORAGE_ACCOUNT }}" \
          -backend-config="container_name=${{ vars.TERRAFORM_CONTAINER }}" \
          -backend-config="key=dev.terraform.tfstate" \
          -backend-config="resource_group_name=${{ vars.TERRAFORM_RESOURCE_GROUP }}"
    
    - name: Terraform Plan
      run: |
        cd azure-infrastructure/terraform
        terraform plan \
          -var="environment=dev" \
          -var="location=${{ vars.AZURE_LOCATION || 'East US' }}" \
          -var="sql_admin_login=${{ secrets.SQL_ADMIN_LOGIN }}" \
          -var="sql_admin_password=${{ secrets.SQL_ADMIN_PASSWORD }}" \
          -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
          -var="sendgrid_api_key=${{ secrets.SENDGRID_API_KEY }}" \
          -out=tfplan
    
    - name: Terraform Apply
      id: terraform
      run: |
        cd azure-infrastructure/terraform
        terraform apply -auto-approve tfplan
        
        # Extract outputs for later use
        APP_SERVICE_NAME=$(terraform output -raw app_service_name)
        STATIC_WEB_APP_NAME=$(terraform output -raw static_web_app_name || echo "")
        
        echo "app-service-name=$APP_SERVICE_NAME" >> $GITHUB_OUTPUT
        echo "static-web-app-name=$STATIC_WEB_APP_NAME" >> $GITHUB_OUTPUT
        
        echo "✅ Infrastructure deployed successfully"
        echo "App Service: $APP_SERVICE_NAME"
        if [ -n "$STATIC_WEB_APP_NAME" ]; then
          echo "Static Web App: $STATIC_WEB_APP_NAME"
        fi

  # ====================
  # DEPLOY BACKEND API
  # ====================
  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-infrastructure]
    environment: development
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-app-development-${{ github.run_id }}
        path: ./backend-app/
        
    - name: Azure CLI login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    
    - name: Deploy to Azure App Service
      run: |
        # Create deployment package
        cd backend-app
        zip -r ../deployment.zip .
        cd ..
        
        # Deploy to App Service
        az webapp deployment source config-zip \
          --resource-group rg-meetingsummary-dev \
          --name ${{ needs.deploy-infrastructure.outputs.app-service-name }} \
          --src deployment.zip
        
        echo "✅ Backend API deployed successfully"
        echo "URL: https://${{ needs.deploy-infrastructure.outputs.app-service-name }}.azurewebsites.net"
    
    - name: Run database migrations
      run: |
        # Get the App Service URL for connection string validation
        APP_URL="https://${{ needs.deploy-infrastructure.outputs.app-service-name }}.azurewebsites.net"
        
        echo "🔄 Running database migrations..."
        
        # Use Azure CLI to run migration command on the App Service
        az webapp ssh --resource-group rg-meetingsummary-dev \
          --name ${{ needs.deploy-infrastructure.outputs.app-service-name }} \
          --timeout 120 << 'EOF'
        
        # Navigate to app directory and run migrations
        cd /home/site/wwwroot
        dotnet MeetingSummarizer.Api.dll --migrate-database
        exit
        EOF
        
        echo "✅ Database migrations completed"

  # ====================
  # DEPLOY FRONTEND
  # ====================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-infrastructure]
    environment: development
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-app-development-${{ github.run_id }}
        path: ./frontend-app/
        
    - name: Azure CLI login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    
    - name: Deploy to Azure Static Web Apps
      run: |
        if [ -n "${{ needs.deploy-infrastructure.outputs.static-web-app-name }}" ]; then
          echo "🚀 Deploying to Azure Static Web Apps..."
          
          # Deploy using Azure Static Web Apps CLI
          npx @azure/static-web-apps-cli deploy \
            --app-location "./frontend-app" \
            --resource-group rg-meetingsummary-dev \
            --app-name ${{ needs.deploy-infrastructure.outputs.static-web-app-name }}
          
          echo "✅ Frontend deployed to Static Web Apps"
        else
          echo "📁 Deploying to App Service as static files..."
          
          # Alternative: Deploy to App Service as static files
          cd frontend-app
          zip -r ../frontend.zip .
          cd ..
          
          # Create a simple web.config for SPA routing
          cat > web.config << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <system.webServer>
            <rewrite>
              <rules>
                <rule name="ReactRouter" stopProcessing="true">
                  <match url=".*" />
                  <conditions logicalGrouping="MatchAll">
                    <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                    <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                  </conditions>
                  <action type="Rewrite" url="/" />
                </rule>
              </rules>
            </rewrite>
          </system.webServer>
        </configuration>
        EOF
          
          # Add web.config to deployment
          zip -u frontend.zip web.config
          
          # Deploy to a separate App Service for frontend if available
          echo "Frontend deployment configured for App Service hosting"
        fi

  # ====================
  # SMOKE TESTS
  # ====================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-infrastructure]
    if: always() && (needs.deploy-backend.result == 'success' || inputs.force-deploy)
    
    steps:
    - name: Checkout scripts
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          .github/scripts/
        sparse-checkout-cone-mode: false
        
    - name: Wait for deployment to stabilize
      run: |
        echo "⏳ Waiting for deployment to stabilize..."
        sleep 30
    
    - name: Test API Health Endpoint
      run: |
        APP_URL="https://${{ needs.deploy-infrastructure.outputs.app-service-name }}.azurewebsites.net"
        
        echo "🧪 Testing API health endpoint: $APP_URL/health"
        
        # Test basic health endpoint
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || echo "000")
        
        if [ "$RESPONSE" = "200" ]; then
          echo "✅ Health endpoint responding correctly"
        else
          echo "❌ Health endpoint failed with status: $RESPONSE"
          exit 1
        fi
    
    - name: Test API Detailed Health
      run: |
        APP_URL="https://${{ needs.deploy-infrastructure.outputs.app-service-name }}.azurewebsites.net"
        
        echo "🧪 Testing detailed health endpoint: $APP_URL/health/detailed"
        
        # Test detailed health endpoint and parse JSON
        RESPONSE=$(curl -s "$APP_URL/health/detailed" || echo '{"status":"error"}')
        
        echo "Health Response: $RESPONSE"
        
        # Simple validation that we got valid JSON back
        if echo "$RESPONSE" | grep -q '"status"'; then
          echo "✅ Detailed health endpoint responding with valid JSON"
        else
          echo "⚠️ Detailed health endpoint response may be invalid"
        fi
    
    - name: Test API Authentication Endpoint
      run: |
        APP_URL="https://${{ needs.deploy-infrastructure.outputs.app-service-name }}.azurewebsites.net"
        
        echo "🧪 Testing authentication endpoint: $APP_URL/api/auth/status"
        
        # Test auth status endpoint (should return 401 for unauthenticated request)
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/api/auth/status" || echo "000")
        
        if [ "$RESPONSE" = "401" ] || [ "$RESPONSE" = "200" ]; then
          echo "✅ Authentication endpoint responding correctly (status: $RESPONSE)"
        else
          echo "❌ Authentication endpoint unexpected status: $RESPONSE"
          exit 1
        fi
    
    - name: Create smoke test summary
      if: always()
      run: |
        echo "## 🧪 Smoke Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment**: Development" >> $GITHUB_STEP_SUMMARY
        echo "**API URL**: https://${{ needs.deploy-infrastructure.outputs.app-service-name }}.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
        echo "**Deploy Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Health Endpoint | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
        echo "| Detailed Health | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
        echo "| Authentication | ✅ Passed |" >> $GITHUB_STEP_SUMMARY

  # ====================
  # DEPLOYMENT SUMMARY
  # ====================
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-infrastructure, deploy-backend, deploy-frontend, smoke-tests]
    if: always()
    
    steps:
    - name: Create deployment summary
      run: |
        echo "## 🚀 Development Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Deployment Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 📊 Job Results" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Build & Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Infrastructure | ${{ needs.deploy-infrastructure.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Backend API | ${{ needs.deploy-backend.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend App | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.deploy-infrastructure.result }}" = "success" ]; then
          echo "### 🔗 Deployment URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: https://${{ needs.deploy-infrastructure.outputs.app-service-name }}.azurewebsites.net" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check**: https://${{ needs.deploy-infrastructure.outputs.app-service-name }}.azurewebsites.net/health" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ needs.deploy-infrastructure.outputs.static-web-app-name }}" ]; then
            echo "- **Frontend**: https://${{ needs.deploy-infrastructure.outputs.static-web-app-name }}.azurestaticapps.net" >> $GITHUB_STEP_SUMMARY
          fi
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Add troubleshooting section if deployment failed
        if [ "${{ needs.deploy-backend.result }}" != "success" ] || [ "${{ needs.deploy-frontend.result }}" != "success" ]; then
          echo "### 🔧 Troubleshooting" >> $GITHUB_STEP_SUMMARY
          echo "If deployment failed, check:" >> $GITHUB_STEP_SUMMARY
          echo "1. Azure resource availability in East US region" >> $GITHUB_STEP_SUMMARY
          echo "2. Service principal permissions for resource group" >> $GITHUB_STEP_SUMMARY
          echo "3. Application settings and connection strings" >> $GITHUB_STEP_SUMMARY
          echo "4. Database migration scripts and permissions" >> $GITHUB_STEP_SUMMARY
        fi

  # ====================
  # NOTIFY TEAM
  # ====================
  notify-team:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-infrastructure, deploy-backend, deploy-frontend, smoke-tests]
    if: always() && github.ref == 'refs/heads/main'  # Only notify for main branch
    
    steps:
    - name: Send notification
      run: |
        # Determine overall status
        if [ "${{ needs.deploy-backend.result }}" = "success" ] && [ "${{ needs.smoke-tests.result }}" = "success" ]; then
          STATUS="✅ SUCCESS"
          COLOR="good"
        elif [ "${{ needs.build-and-test.result }}" != "success" ]; then
          STATUS="❌ BUILD FAILED"
          COLOR="danger"
        else
          STATUS="⚠️ DEPLOYMENT ISSUES"
          COLOR="warning"
        fi
        
        echo "Deployment Status: $STATUS"
        echo "Would send notification to team about development deployment"
        
        # In a real implementation, this would send to Slack/Teams/Email
        # For now, we just log the notification details
        echo "📧 Notification details:"
        echo "- Status: $STATUS"
        echo "- Branch: ${{ github.ref_name }}"
        echo "- Commit: ${{ github.sha }}"
        echo "- URL: https://${{ needs.deploy-infrastructure.outputs.app-service-name }}.azurewebsites.net"