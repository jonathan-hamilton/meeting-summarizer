name: Shared Build and Test

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (development/production)'
        required: true
        type: string
      run-security-scan:
        description: 'Run security scanning (OWASP ZAP)'
        required: false
        type: boolean
        default: false
    outputs:
      backend-version:
        description: "Backend application version"
        value: ${{ jobs.build-backend.outputs.version }}
      frontend-version:
        description: "Frontend application version"
        value: ${{ jobs.build-frontend.outputs.version }}

jobs:
  # ====================
  # BUILD & TEST BACKEND
  # ====================
  build-backend:
    name: Build .NET API
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for version calculation
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Calculate version
      id: version
      run: |
        # Use git commit hash and timestamp for unique version
        VERSION="1.0.${{ github.run_number }}-$(git rev-parse --short HEAD)"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Application version: $VERSION"
    
    - name: Restore dependencies
      run: dotnet restore MeetingSummarizer.Api/MeetingSummarizer.Api.csproj
      
    - name: Build application
      run: |
        dotnet build MeetingSummarizer.Api/MeetingSummarizer.Api.csproj \
          --configuration Release \
          --no-restore \
          -p:Version=${{ steps.version.outputs.version }}
    
    - name: Run unit tests
      run: |
        dotnet test MeetingSummarizer.Api.Tests/MeetingSummarizer.Api.Tests.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./test-results
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results-${{ inputs.environment }}
        path: ./test-results/
        retention-days: 7
        
    - name: Publish application
      run: |
        dotnet publish MeetingSummarizer.Api/MeetingSummarizer.Api.csproj \
          --configuration Release \
          --output ./publish \
          --no-build \
          -p:Version=${{ steps.version.outputs.version }}
    
    - name: Upload backend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-app-${{ inputs.environment }}-${{ github.run_id }}
        path: ./publish/
        retention-days: 30

  # =======================
  # BUILD & TEST FRONTEND
  # =======================
  build-frontend:
    name: Build React App
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Calculate version
      id: version
      run: |
        cd frontend
        VERSION="1.0.${{ github.run_number }}-$(git rev-parse --short HEAD)"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Frontend version: $VERSION"
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run linting
      run: |
        cd frontend
        npm run lint
    
    - name: Run unit tests
      run: |
        cd frontend
        npm run test:coverage
    
    - name: Upload frontend test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-test-results-${{ inputs.environment }}
        path: frontend/coverage/
        retention-days: 7
    
    - name: Build frontend
      run: |
        cd frontend
        # Set environment-specific build configuration
        if [ "${{ inputs.environment }}" = "production" ]; then
          export VITE_API_URL="https://meetingsummary-prod-api.azurewebsites.net"
          export VITE_ENVIRONMENT="production"
        else
          export VITE_API_URL="https://meetingsummary-dev-api.azurewebsites.net"
          export VITE_ENVIRONMENT="development"
        fi
        
        export VITE_VERSION="${{ steps.version.outputs.version }}"
        npm run build
    
    - name: Upload frontend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-app-${{ inputs.environment }}-${{ github.run_id }}
        path: frontend/dist/
        retention-days: 30

  # ========================
  # INTEGRATION TESTS
  # ========================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    services:
      # Use SQL Server for realistic integration testing
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: IntegrationTest123!
          MSSQL_PID: Express
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P IntegrationTest123! -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-app-${{ inputs.environment }}-${{ github.run_id }}
        path: ./backend-app/
        
    - name: Setup test database
      run: |
        # Wait for SQL Server to be ready
        sleep 30
        
        # Create test database and run migrations
        export ConnectionStrings__DefaultConnection="Server=localhost,1433;Database=MeetingSummarizerDb_Test;User Id=sa;Password=IntegrationTest123!;TrustServerCertificate=true"
        
        cd MeetingSummarizer.Api
        dotnet ef database update --connection "$ConnectionStrings__DefaultConnection"
    
    - name: Run integration tests
      run: |
        export ConnectionStrings__DefaultConnection="Server=localhost,1433;Database=MeetingSummarizerDb_Test;User Id=sa;Password=IntegrationTest123!;TrustServerCertificate=true"
        export ASPNETCORE_ENVIRONMENT=Testing
        
        dotnet test MeetingSummarizer.Api.Tests/MeetingSummarizer.Api.Tests.csproj \
          --configuration Release \
          --filter "Category=Integration" \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./integration-test-results
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results-${{ inputs.environment }}
        path: ./integration-test-results/
        retention-days: 7

  # ========================
  # SECURITY SCANNING
  # ========================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    if: inputs.run-security-scan
    needs: [build-backend, build-frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-app-${{ inputs.environment }}-${{ github.run_id }}
        path: ./backend-app/
    
    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-app-${{ inputs.environment }}-${{ github.run_id }}
        path: ./frontend-app/
    
    # Dependency vulnerability scanning
    - name: Run dependency check (Backend)
      run: |
        dotnet list MeetingSummarizer.Api/MeetingSummarizer.Api.csproj package --vulnerable --include-transitive > dependency-check-backend.txt || true
        cat dependency-check-backend.txt
    
    - name: Run dependency check (Frontend)
      run: |
        cd frontend
        npm audit --audit-level moderate --output json > ../dependency-check-frontend.json || true
        cat ../dependency-check-frontend.json
    
    # Static code analysis
    - name: Initialize CodeQL
      if: inputs.environment == 'production'
      uses: github/codeql-action/init@v3
      with:
        languages: csharp, javascript
        
    - name: Perform CodeQL Analysis
      if: inputs.environment == 'production'
      uses: github/codeql-action/analyze@v3
    
    # Upload security scan results
    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results-${{ inputs.environment }}
        path: |
          dependency-check-*.txt
          dependency-check-*.json
        retention-days: 30

  # ========================
  # BUILD SUMMARY
  # ========================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, integration-tests]
    if: always()
    
    steps:
    - name: Display build summary
      run: |
        echo "## Build Summary for ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Version | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|---------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Backend | ${{ needs.build-backend.outputs.version }} | ${{ needs.build-backend.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend | ${{ needs.build-frontend.outputs.version }} | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Tests | - | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ inputs.run-security-scan }}" = "true" ]; then
          echo "| Security Scan | - | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "**Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY